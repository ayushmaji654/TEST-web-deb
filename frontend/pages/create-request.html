<h2>Create Request</h2>

<form onsubmit="createRequest(event)">

  <input id="title" type="text" placeholder="Title" required><br><br>

  <select id="category" required>
    <option value="">Category</option>
    <option>Notes</option>
    <option>Doubt</option>
    <option>Tech Help</option>
    <option>Event</option>
  </select><br><br>

  <textarea id="description" placeholder="Description" required></textarea><br><br>

  <input id="deadline" type="date"><br><br>

<button type="submit">Submit</button>


</form>

<script src="../js/auth.js"></script>
<script src="../js/requests.js"></script>

  checkLogin();
